<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="run-as-admin-t run-as-admin-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="run-as-admin-t">Lancer installer-service.bat en administrateur</title>
<desc id="run-as-admin-d">1 : dans le dossier aruba-agent, clic droit sur installer-service.bat. 2 : dans le menu, choisis Exécuter en tant qu’administrateur. 3 : Windows demande « Voulez-vous autoriser cette application à apporter des modifications à votre appareil ? » pour le Processeur de commandes Windows : clique sur Oui.</desc>
