<title id="python-install-t">Installer Python sur Windows</title>
<desc id="python-install-d">Installateur de Python 3 pour Windows. 1 : coche d’abord la case Add python.exe to PATH, en bas de la fenêtre. 2 : clique sur Install Now (Includes IDLE, pip and documentation).</desc>
