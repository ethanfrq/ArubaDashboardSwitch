<text x="144" y="236" font-size="16" fill="#52514e" font-weight="600" text-anchor="middle">python</text>
<text x="240" y="90" font-size="18" fill="#0b0b0b" font-weight="600">Install Python 3.x (64-bit)</text>
<text x="240" y="114" font-size="13" fill="#52514e">Select Install Now to install Python with</text>
<text x="240" y="132" font-size="13" fill="#52514e">default settings, or choose Customize to</text>
