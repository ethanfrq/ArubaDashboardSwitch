<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="agent-password-t agent-password-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="agent-password-t">Saisir le mot de passe SSH du switch</title>
<desc id="agent-password-d">Console Administrateur ouverte par installer-service.bat. 1 : à la ligne « Mot de passe SSH de admin@192.168.10.2 : », tape le mot de passe SSH du switch puis Entrée (rien ne s’affiche pendant la saisie). 2 : la console affiche « Mot de passe enregistré (chiffré). » puis « Service installé et démarré. Journal : C:\aruba-agent\agent.log ». L’agent démarre ensuite avec Windows.</desc>
<rect x="1" y="1" width="718" height="398" rx="16" fill="#fcfcfb" stroke="#e2e1da" stroke-width="2"/>
<rect x="24" y="24" width="672" height="216" rx="10" fill="#1a1a19"/>
<path d="M24 56V34a10 10 0 0 1 10-10H686a10 10 0 0 1 10 10V56Z" fill="#2f2f2c"/>
<rect x="24" y="24" width="672" height="216" rx="10" fill="none" stroke="#2f2f2c" stroke-width="2"/>
<rect x="38" y="33" width="16" height="13" rx="3" fill="#0b0b0b"/>
<path d="M40.8 36.3l2.2 2.2l-2.2 2.2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="45" font-size="13" fill="#c3c2b7">Administrateur : C:\Windows\System32\cmd.exe</text>
<line x1="606" y1="40" x2="616" y2="40" stroke="#c3c2b7" stroke-width="1.5"/>
<rect x="635" y="35" width="10" height="10" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<path d="M665 35l10 10m0-10l-10 10" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<rect x="356.8" y="114" width="56" height="24" rx="4.5" fill="none" stroke="#ff8300" stroke-width="2"/>
<rect x="34" y="175" width="503.4" height="26" rx="5" fill="none" stroke="#ff8300" stroke-width="2"/>
<text x="40" y="80" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">=== Mot de passe SSH du switch (laisse vide pour garder celui deja</text>
<text x="40" y="100" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">enregistre) ===</text>
<text x="40" y="131" font-size="13" fill="#f4f4f1" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve">Mot de passe SSH de admin@192.168.10.2 : <tspan fill="#ffa64d" font-weight="600">••••••</tspan></text>
<text x="40" y="155" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">Mot de passe enregistré (chiffré).</text>
<text x="40" y="193" font-size="13" fill="#4cc26b" font-weight="600" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">Service installé et démarré. Journal : C:\aruba-agent\agent.log</text>
<text x="40" y="220" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">Appuyez sur une touche pour continuer...</text>
<circle cx="439.8" cy="126" r="13" fill="#ff8300" stroke="#ffffff" stroke-width="2"/>
<text x="439.8" y="131" font-size="14" fill="#1d0f00" font-weight="700" text-anchor="middle">1</text>
<circle cx="563.4" cy="188" r="13" fill="#ff8300" stroke="#ffffff" stroke-width="2"/>
<text x="563.4" y="193" font-size="14" fill="#1d0f00" font-weight="700" text-anchor="middle">2</text>
<!-- Explications -->
<rect x="24" y="260" width="324" height="116" rx="12" fill="#f4f4f1" stroke="#e2e1da" stroke-width="1.5"/>
<circle cx="50" cy="288" r="13" fill="#ff8300" stroke="#ffffff" stroke-width="2"/>
<text x="50" y="293" font-size="14" fill="#1d0f00" font-weight="700" text-anchor="middle">1</text>
<text x="72" y="293" font-size="14" fill="#0b0b0b" font-weight="600">Mot de passe SSH du switch</text>
<text x="72" y="315" font-size="13" fill="#52514e">Tape-le, puis appuie sur Entrée.</text>
<text x="72" y="334" font-size="13" fill="#52514e">Rien ne s’affiche pendant la</text>
<text x="72" y="353" font-size="13" fill="#52514e">saisie : c’est normal.</text>
<rect x="372" y="260" width="324" height="116" rx="12" fill="#f4f4f1" stroke="#e2e1da" stroke-width="1.5"/>
<circle cx="398" cy="288" r="13" fill="#ff8300" stroke="#ffffff" stroke-width="2"/>
<text x="398" y="293" font-size="14" fill="#1d0f00" font-weight="700" text-anchor="middle">2</text>
<text x="420" y="293" font-size="14" fill="#0b0b0b" font-weight="600">Service installé et démarré</text>
<text x="420" y="315" font-size="13" fill="#52514e">L’agent démarre avec Windows.</text>
<text x="420" y="334" font-size="13" fill="#52514e">Reviens au dashboard : il</text>
<text x="420" y="353" font-size="13" fill="#52514e">affiche « Agent connecté ».</text>
</svg>
