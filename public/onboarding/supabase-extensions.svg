<title id="supabase-extensions-t">Activer pg_cron et pg_net dans Supabase</title>
<desc id="supabase-extensions-d">Ouvre la base depuis Vercel (Storage, ta base, Open in Supabase). Dans Supabase : 1 : menu Database. 2 : Extensions. 3 : active pg_cron (Job scheduler for PostgreSQL) et pg_net (Async HTTP) : les interrupteurs deviennent verts.</desc>
