<title id="phone-2fa-t">Activer la double authentification</title>
<desc id="phone-2fa-d">Page Mon profil du dashboard, carte Double authentification (Désactivée). 1 : scanne le QR code avec ton application d’authentification (Google Authenticator, Microsoft Authenticator…). 2 : l’application affiche pour My Aruba Manager (admin) un code à 6 chiffres, ici 482 913. 3 : saisis ce code dans le champ « code à 6 chiffres » puis clique sur Activer.</desc>
