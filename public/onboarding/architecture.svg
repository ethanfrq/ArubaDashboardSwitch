<line x1="500" y1="334" x2="528" y2="334" stroke="#0b0b0b" stroke-width="2"/>
<text x="544" y="329" font-size="15" fill="#0b0b0b" font-weight="600">Navigateur</text>
<text x="544" y="348" font-size="13" fill="#52514e">partout : PC,</text>
<text x="544" y="365" font-size="13" fill="#52514e">tablette, téléphone</text>
<path d="M582 302L582 284" fill="none" stroke="#ff8300" stroke-width="2" stroke-linejoin="round"/>
<path d="M582 274L587.5 284L576.5 284Z" fill="#ff8300"/>
<text x="594" y="299" font-size="13" fill="#0b0b0b" font-weight="600">HTTPS</text>
<text x="40" y="330" font-size="13" fill="#0b0b0b" font-weight="600">Le switch reste chez toi :</text>
<text x="40" y="349" font-size="13" fill="#52514e">seul le PC de l’agent lui parle.</text>
