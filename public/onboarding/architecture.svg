<text x="334" y="221" font-size="15" fill="#0b0b0b" font-weight="600">Internet</text>
<text x="360" y="262" font-size="13" fill="#52514e" text-anchor="middle">HTTPS sortant seulement</text>
<rect x="282" y="272" width="156" height="26" rx="13" fill="#dff2e3"/>
<rect x="296" y="283" width="11" height="8" rx="2" fill="#1f8a3c"/>
<path d="M298.5 283v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#1f8a3c" stroke-width="1.6"/>
<text x="314" y="290" font-size="13" fill="#1f8a3c" font-weight="600">aucun port ouvert</text>
<!-- Navigateur, partout -->
<rect x="484" y="304" width="196" height="72" rx="12" fill="#ffffff" stroke="#d4d3cb" stroke-width="2"/>
