<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="architecture-t architecture-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="architecture-t">Comment My Aruba Manager est relié</title>
<desc id="architecture-d">Schéma d’ensemble. Dans le réseau local, le PC de l’agent (Windows, Python) lit le switch Aruba SWITCH-DEMO (192.168.10.2) en SSH. Il envoie l’état du switch par Internet, en HTTPS sortant seulement, sans aucun port ouvert, au dashboard hébergé sur Vercel, qui enregistre les données dans la base Supabase. Tu ouvres le dashboard depuis un navigateur, partout : PC, tablette ou téléphone.</desc>
