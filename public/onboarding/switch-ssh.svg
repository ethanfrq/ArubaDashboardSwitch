<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="switch-ssh-t switch-ssh-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="switch-ssh-t">Vérifier SSH et l’IP de gestion du switch</title>
<desc id="switch-ssh-d">Console du switch SWITCH-DEMO (câble console ou SSH). 1 : la commande show ssh server all-vrfs affiche le bloc SSH server configuration on VRF default : SSH est configuré sur ce VRF. 2 : la commande show ip interface vlan1 affiche l’adresse IPv4 de gestion 192.168.10.2/24, à indiquer à l’agent (sur un switch avec un port de gestion dédié : show interface mgmt). Si SSH est désactivé : configure terminal, ssh server vrf default, end, write memory.</desc>
<rect x="1" y="1" width="718" height="398" rx="16" fill="#fcfcfb" stroke="#e2e1da" stroke-width="2"/>
<rect x="24" y="24" width="456" height="280" rx="10" fill="#1a1a19"/>
<path d="M24 56V34a10 10 0 0 1 10-10H470a10 10 0 0 1 10 10V56Z" fill="#2f2f2c"/>
<rect x="24" y="24" width="456" height="280" rx="10" fill="none" stroke="#2f2f2c" stroke-width="2"/>
<text x="38" y="45" font-size="13" fill="#c3c2b7">SWITCH-DEMO : console ou SSH</text>
<line x1="390" y1="40" x2="400" y2="40" stroke="#c3c2b7" stroke-width="1.5"/>
<rect x="419" y="35" width="10" height="10" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<path d="M449 35l10 10m0-10l-10 10" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<rect x="33" y="89" width="334" height="25" rx="5.5" fill="none" stroke="#ff8300" stroke-width="2"/>
<rect x="33" y="209" width="240" height="25" rx="5.5" fill="none" stroke="#ff8300" stroke-width="2"/>
<text x="40" y="82" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#4cc26b">SWITCH-DEMO# </tspan><tspan fill="#f4f4f1" font-weight="600">show ssh server all-vrfs</tspan></text>
<text x="40" y="106" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve">SSH server configuration on VRF <tspan fill="#ffa64d" font-weight="600">default</tspan> :</text>
<text x="40" y="128" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve">  TCP Port : 22</text>
<text x="40" y="160" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#4cc26b">SWITCH-DEMO# </tspan><tspan fill="#f4f4f1" font-weight="600">show ip interface vlan1</tspan></text>
<text x="40" y="182" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve">Interface vlan1 is up</text>
<text x="40" y="204" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve"> Admin state is up</text>
<text x="40" y="226" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve"> IPv4 address <tspan fill="#ffa64d" font-weight="600">192.168.10.2/24</tspan></text>
<text x="40" y="248" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve"> IP MTU 1500</text>
<text x="40" y="282" font-size="13" fill="#c3c2b7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#4cc26b">SWITCH-DEMO# </tspan></text>
<rect x="141.4" y="270" width="8" height="16" fill="#c3c2b7"/>
<text x="24" y="338" font-size="13" fill="#52514e">À taper sur le switch (câble console ou SSH),</text>
<text x="24" y="357" font-size="13" fill="#52514e">pas dans le dashboard.</text>
<!-- Explications -->
<line x1="367" y1="101" x2="495" y2="101" stroke="#ff8300" stroke-width="2"/>
<circle cx="510" cy="101" r="13" fill="#ff8300" stroke="#ffffff" stroke-width="2"/>
<text x="510" y="106" font-size="14" fill="#1d0f00" font-weight="700" text-anchor="middle">1</text>
<text x="530" y="106" font-size="14" fill="#0b0b0b" font-weight="600">SSH est configuré</text>
<text x="530" y="126" font-size="13" fill="#52514e">bloc du VRF default</text>
<text x="530" y="144" font-size="13" fill="#52514e">(ou mgmt)</text>
<line x1="273" y1="221" x2="495" y2="221" stroke="#ff8300" stroke-width="2"/>
<circle cx="510" cy="221" r="13" fill="#ff8300" stroke="#ffffff" stroke-width="2"/>
<text x="510" y="226" font-size="14" fill="#1d0f00" font-weight="700" text-anchor="middle">2</text>
<text x="530" y="226" font-size="14" fill="#0b0b0b" font-weight="600">IP de gestion</text>
<text x="530" y="246" font-size="13" fill="#52514e">à indiquer à l’agent</text>
<rect x="496" y="262" width="200" height="120" rx="10" fill="#f4f4f1" stroke="#e2e1da" stroke-width="1.5"/>
<text x="510" y="286" font-size="14" fill="#0b0b0b" font-weight="600">SSH désactivé ?</text>
<text x="510" y="308" font-size="13" fill="#0b0b0b" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">configure terminal</text>
<text x="510" y="327" font-size="13" fill="#0b0b0b" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">ssh server vrf default</text>
<text x="510" y="346" font-size="13" fill="#0b0b0b" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">end</text>
<text x="510" y="365" font-size="13" fill="#0b0b0b" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">write memory</text>
</svg>
